# Desde la raíz del proyecto:
#   docker compose -f deploy/docker-compose.postgres.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: docucentral
      POSTGRES_USER: docucentral
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docucentral"]
      interval: 5s
      retries: 10

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=db;Database=docucentral;Username=docucentral;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    volumes:
      - ${RUTA_REPOSITORIO}:/data/repositorio
      - ${RUTA_ENTRADA}:/data/entrada
      - ${RUTA_ERRORES}:/data/errores

volumes:
  pgdata:
