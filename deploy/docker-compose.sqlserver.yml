# Desde la raíz del proyecto:
#   docker compose -f deploy/docker-compose.sqlserver.yml --env-file .env up -d --build
# DB_PASSWORD debe cumplir la política de SQL Server (8+ caracteres, mayúsculas, minúsculas, números o símbolos).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mssqldata:/var/opt/mssql

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__Default: Server=db;Database=DocuCentral;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    volumes:
      - ${RUTA_REPOSITORIO}:/data/repositorio
      - ${RUTA_ENTRADA}:/data/entrada
      - ${RUTA_ERRORES}:/data/errores

volumes:
  mssqldata:
